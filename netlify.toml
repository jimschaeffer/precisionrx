[build]
  publish = "public/"
  command = "npm run build"

[[plugins]]
package = "netlify-plugin-cache"

  [plugins.inputs]
  paths = [
    # NOTE: public/assets/images is deliberately NOT cached. It is both the
    # sharp output dir and the passthrough target for src/assets/images, so
    # caching it restores deleted images into every subsequent deploy - the
    # old CodeStitch demo files were shipping months after being removed.
    # The only sharp work is a handful of og:image crops; regenerating them
    # each build costs seconds.
    ".cache" # Remote Assets
  ]

# Fonts carry a version in the filename (poppins-v24-...), so they can be cached
# indefinitely. CSS/JS/images are NOT hashed and are deliberately left on
# Netlify's revalidating default so a content change goes live immediately.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: jimschaeffer/precisionrx
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/e5cb409a-1778-4023-8e33-f56765a40c40/pkce
  auth_token_endpoint: /sites/e5cb409a-1778-4023-8e33-f56765a40c40/token
  gateway_url: https://gateway.decapbridge.com
  auth:
    email_claim: email
    first_name_claim: first_name
    last_name_claim: last_name
    avatar_url_claim: avatar_url
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://prxpharm.com/assets/images/logo.png

# Add site links in Decap CMS (optional)
site_url: https://prxpharm.com

# Keep this to allow you to edit the cms locally
local_backend: true

# Image folders
media_folder: "src/assets/images/blog"
public_folder: "/assets/images/blog"

# Decap CMS Collections
collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "SEO Title",
          name: "seoTitle",
          widget: "string",
          required: false,
          hint: "Optional. Shown in Google results and the browser tab instead of the title above. Keep it under 60 characters so it isn't truncated.",
        }
      - {
          label: "URL Slug",
          name: "url",
          widget: "string",
          hint: 'Specify where the page will be written to. If you use "Blog Post", the post will be accessible from "blog/blog-post"',
        }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Last Updated",
          name: "updated",
          widget: "datetime",
          required: false,
          hint: "Optional. Set this when you revise a published post - it feeds dateModified in the article markup.",
        }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Image Caption", name: "imageAlt", widget: "string" }
      - {
          label: "FAQ",
          name: "faq",
          widget: "list",
          required: false,
          label_singular: "Question",
          hint: "Optional. Mirror the Q&A you wrote in the body here to make the post eligible for Google's FAQ rich result. The wording must match what readers see on the page.",
          fields:
            [
              { label: "Question", name: "q", widget: "string" },
              { label: "Answer", name: "a", widget: "text" },
            ],
        }
      - { label: "Body", name: "body", widget: "markdown" }
